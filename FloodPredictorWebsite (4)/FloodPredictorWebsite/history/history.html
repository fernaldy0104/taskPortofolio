<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historical Data - Jakarta Flood Predictor</title>
    <link rel="stylesheet" href="../components_assets/component.css">
    <link rel="stylesheet" href="history.css">
</head>

<body>
    <nav class="navbar">
        <a href="../landing/index.html" class="navbar-logo">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path
                    d="M12 3C12 3 8.5 6 8.5 9C8.5 10.933 10.067 12.5 12 12.5C13.933 12.5 15.5 10.933 15.5 9C15.5 6 12 3 12 3Z"
                    fill="currentColor" />
                <path
                    d="M17.5 13C17.5 13 15.5 15 15.5 16.5C15.5 17.605 16.395 18.5 17.5 18.5C18.605 18.5 19.5 17.605 19.5 16.5C19.5 15 17.5 13 17.5 13Z"
                    fill="currentColor" />
                <path
                    d="M6.5 13C6.5 13 4.5 15 4.5 16.5C4.5 17.605 5.395 18.5 6.5 18.5C7.605 18.5 8.5 17.605 8.5 16.5C8.5 15 6.5 13 6.5 13Z"
                    fill="currentColor" />
                <path
                    d="M12 14C12 14 10 16 10 17.5C10 18.605 10.895 19.5 12 19.5C13.105 19.5 14 18.605 14 17.5C14 16 12 14 12 14Z"
                    fill="currentColor" />
            </svg>
        </a>
        <button class="navbar-toggle" aria-label="Toggle navigation">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M3 6H21M3 12H21M3 18H21" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            </svg>
        </button>
        <ul class="navbar-nav">
            <li><a href="../landing/index.html">Home</a></li>
            <li><a href="../dashboard/dashboard.html">Dashboard</a></li>
            <li><a href="history.html">History</a></li>
        </ul>
    </nav>
    <main class="history-page">
        <!-- Page Header -->
        <header class="page-header">
            <div class="header-content">
                <h1>Historical Data</h1>
                <p>View flood prediction records from previous weeks, months, and years</p>
            </div>
        </header>
        <!-- Time Period Tabs -->
        <section class="history-container">
            <div class="tab-navigation">
                <button class="tab-btn active" data-tab="weekly">
                    <span class="tab-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <rect x="3" y="6" width="18" height="15" rx="2" stroke="currentColor" stroke-width="2" />
                            <path d="M3 10H21" stroke="currentColor" stroke-width="2" />
                            <path d="M8 3V7" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                            <path d="M16 3V7" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                        </svg>
                    </span>
                    Weekly
                </button>
                <button class="tab-btn" data-tab="monthly">
                    <span class="tab-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <rect x="3" y="6" width="18" height="15" rx="2" stroke="currentColor" stroke-width="2" />
                            <path d="M3 10H21" stroke="currentColor" stroke-width="2" />
                            <path d="M7 3V7" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                            <path d="M17 3V7" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                            <circle cx="8" cy="14" r="1" fill="currentColor" />
                            <circle cx="12" cy="14" r="1" fill="currentColor" />
                            <circle cx="16" cy="14" r="1" fill="currentColor" />
                            <circle cx="8" cy="18" r="1" fill="currentColor" />
                            <circle cx="12" cy="18" r="1" fill="currentColor" />
                        </svg>
                    </span>
                    Monthly
                </button>
                <button class="tab-btn" data-tab="yearly">
                    <span class="tab-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M3 13L7 9L11 13L17 7L21 11" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round" />
                            <rect x="3" y="3" width="18" height="18" rx="2" stroke="currentColor" stroke-width="2" />
                        </svg>
                    </span>
                    Yearly
                </button>
            </div>
            <!-- Summary Stats -->
            <div class="summary-bar">
                <div class="summary-item">
                    <span class="summary-label">Records</span>
                    <span class="summary-value" id="record-count">-</span>
                </div>
                <div class="summary-item">
                    <span class="summary-label">Avg Probability</span>
                    <span class="summary-value" id="avg-probability">-</span>
                </div>
                <div class="summary-item">
                    <span class="summary-label">Highest Risk</span>
                    <span class="summary-value" id="highest-risk">-</span>
                </div>
            </div>
            <!-- Tab Content -->
            <div class="tab-content active" id="weekly-content">
                <div class="timeline" id="weekly-timeline"></div>
            </div>
            <div class="tab-content" id="monthly-content">
                <div class="timeline" id="monthly-timeline"></div>
            </div>
            <div class="tab-content" id="yearly-content">
                <div class="timeline" id="yearly-timeline"></div>
            </div>
        </section>
    </main>
    <footer class="footer">
        <div class="footer-content">
            <div class="footer-copyright">
                © 2024 Jakarta Flood Predictor. All rights reserved.
            </div>
        </div>
    </footer>
    <script src="history.js"></script>
</body>

</html>
